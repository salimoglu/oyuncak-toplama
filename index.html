<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff8fab" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Oyuncak Toplama" />
    <meta
      name="description"
      content="İki oyuncu, kodlama bloklarıyla karakterini hareket ettirip oyuncak toplar. En çok toplayan kazanır."
    />
    <title>Oyuncak Toplama</title>
    <link rel="manifest" href="manifest.json" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧸%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="chrome">
        <div id="version-badge" class="version-badge">v0.9</div>
        <button
          id="sound-btn"
          class="icon-btn"
          type="button"
          aria-label="Sesi aç veya kapat"
        >
          🔊
        </button>
      </header>
      <div id="stage">
      <section id="screen-home" class="screen active">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
        <div class="home-hero">
          <div class="logo-toys" aria-hidden="true">🧸 🚗 🎈 🎨</div>
          <h1>Oyuncak Toplama</h1>
          <p class="tagline">İki kişi veya bota karşı, kodlarla yarışın!</p>
          <div class="home-actions">
            <button id="btn-play" class="big-btn" type="button">İki kişi</button>
            <button id="btn-play-bot" class="ghost-btn" type="button">Bota karşı</button>
            <div id="diff-row" class="diff-row">
              <span>Bot:</span>
              <button type="button" class="diff-btn" data-diff="kolay">Kolay</button>
              <button type="button" class="diff-btn on" data-diff="orta">Orta</button>
              <button type="button" class="diff-btn" data-diff="zor">Zor</button>
            </div>
          </div>
        </div>
      </section>

      <section id="screen-character" class="screen">
        <h2 id="char-title">1. oyuncu kim?</h2>
        <p id="char-hint" class="hint">Solda oynayacak karakteri seç.</p>
        <div id="picked-row" class="picked-row"></div>
        <div id="character-grid" class="card-grid picks"></div>
        <button id="btn-back-home" class="text-btn" type="button">← Geri</button>
      </section>

      <section id="screen-room" class="screen">
        <h2>Hangi oda dağınık?</h2>
        <p class="hint">Toplanacak odayı seç. En çok toplayan kazanır.</p>
        <div id="room-grid" class="card-grid rooms picks"></div>
        <button id="btn-back-character" class="text-btn" type="button">← Geri</button>
      </section>

      <section id="screen-play" class="screen play">
        <header class="play-bar">
          <button id="btn-exit-play" class="icon-btn small" type="button" aria-label="Çık">
            ←
          </button>
          <div class="play-title">
            <span id="play-room-emoji"></span>
            <span id="play-room-name"></span>
          </div>
          <div id="scoreboard" class="scoreboard" aria-live="polite"></div>
          <button
            id="sound-btn-play"
            class="icon-btn small"
            type="button"
            aria-label="Sesi aç veya kapat"
          >
            🔊
          </button>
        </header>
        <div class="play-layout">
          <aside id="dock-p1" class="code-dock p1"></aside>
          <div id="room-stage" class="room-stage">
            <div class="furniture" id="furniture"></div>
            <div id="board" class="board"></div>
            <div id="actors" class="actors"></div>
            <div id="cheer" class="cheer" hidden></div>
          </div>
          <aside id="dock-p2" class="code-dock p2"></aside>
        </div>
      </section>

      <section id="screen-win" class="screen win">
        <div class="win-card">
          <div id="win-stars" class="stars" aria-hidden="true">⭐ ⭐ ⭐</div>
          <h2 id="win-title">Oda tertemiz!</h2>
          <p id="win-text">En çok toplayan kazandı.</p>
          <div id="win-scores" class="win-scores"></div>
          <div class="win-actions">
            <button id="btn-next-room" class="big-btn" type="button">Başka oda</button>
            <button id="btn-replay" class="ghost-btn" type="button">Yeniden oyna</button>
            <button id="btn-home" class="text-btn" type="button">Ana menü</button>
          </div>
        </div>
        <div id="confetti" class="confetti" aria-hidden="true"></div>
      </section>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
